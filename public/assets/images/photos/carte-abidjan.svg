<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="Carte stylisée d'Abidjan avec la position des livreurs en course">
  <defs>
    <filter id="epPin" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#12211B" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Sol -->
  <rect width="700" height="420" fill="#EDEADF"/>

  <!-- Espaces verts -->
  <g fill="#D8E6DB">
    <rect x="34" y="24" width="152" height="80" rx="6"/>
    <circle cx="288" cy="76" r="34"/>
    <rect x="470" y="330" width="196" height="72" rx="6"/>
  </g>

  <!-- Trame viaire — rive nord (Yopougon / Adjamé / Cocody) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M0 58h700M0 122h700M0 190h700"/>
    <path d="M76 0v226M164 0v226M256 0v226M348 0v226M440 0v226M534 0v226M624 0v226"/>
  </g>

  <!-- Trame viaire — rive sud (Treichville / Marcory) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M0 348h700M0 396h700"/>
    <path d="M96 312v108M188 312v108M282 316v104M392 320v100M496 322v98M596 318v102"/>
  </g>

  <!-- Lagune Ébrié -->
  <path fill="#B7CEDD" d="M0 232c86-8 132 14 206 20 66 5 104-16 168-14 74 3 112 30 182 26 56-3 100-20 144-14v54c-52-6-98 12-158 16-72 5-116-22-190-24-66-2-104 20-170 16C114 310 74 292 0 300z"/>
  <path fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.5"
        d="M0 232c86-8 132 14 206 20 66 5 104-16 168-14 74 3 112 30 182 26 56-3 100-20 144-14"/>

  <!-- Axes principaux -->
  <g fill="none" stroke="#E9C98C" stroke-width="9" stroke-linecap="round">
    <path d="M0 158h700"/>
    <path d="M300 0v158"/>
    <path d="M300 158c0 52 44 84 116 108 86 28 176 46 276 44"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 10" opacity=".75">
    <path d="M0 158h700"/>
    <path d="M300 0v158"/>
  </g>

  <!-- Pont Houphouët-Boigny -->
  <g fill="none" stroke="#C9BFA6" stroke-width="8" stroke-linecap="round">
    <path d="M214 224v96"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".6">
    <path d="M214 224v96"/>
  </g>

  <!-- Îlots de bâti -->
  <g fill="#DCD7C7" opacity=".92">
    <rect x="90" y="66" width="60" height="44" rx="3"/>
    <rect x="178" y="132" width="66" height="46" rx="3"/>
    <rect x="362" y="66" width="66" height="44" rx="3"/>
    <rect x="454" y="132" width="70" height="46" rx="3"/>
    <rect x="548" y="66" width="64" height="44" rx="3"/>
    <rect x="110" y="358" width="66" height="34" rx="3"/>
    <rect x="300" y="356" width="76" height="36" rx="3"/>
  </g>

  <!-- Traces de courses en cours -->
  <g fill="none" stroke-linecap="round" stroke-dasharray="6 8" stroke-width="3">
    <path stroke="#33557F" d="M300 158c34 26 62 56 92 82"/>
    <path stroke="#B87514" d="M300 158c-52 4-96 16-134 40"/>
  </g>

  <!-- Pharmacie de départ -->
  <g filter="url(#epPin)">
    <circle cx="300" cy="158" r="13" fill="#12211B"/>
    <path d="M300 152v12M294 158h12" stroke="#6FBF9B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Livreurs -->
  <g filter="url(#epPin)">
    <circle cx="392" cy="240" r="11" fill="#33557F"/><circle cx="392" cy="240" r="4" fill="#FFFFFF"/>
    <circle cx="166" cy="198" r="11" fill="#B87514"/><circle cx="166" cy="198" r="4" fill="#FFFFFF"/>
    <circle cx="560" cy="366" r="11" fill="#0E5C43"/><circle cx="560" cy="366" r="4" fill="#FFFFFF"/>
    <circle cx="596" cy="112" r="11" fill="#0E5C43"/><circle cx="596" cy="112" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Repères -->
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#6B7A73" letter-spacing=".08em">
    <text x="30" y="42">YOPOUGON</text>
    <text x="318" y="42">ADJAMÉ</text>
    <text x="556" y="42">COCODY</text>
    <text x="300" y="288" fill="#3F6480">LAGUNE ÉBRIÉ</text>
    <text x="30" y="340">TREICHVILLE</text>
    <text x="556" y="326">MARCORY</text>
  </g>
</svg>
